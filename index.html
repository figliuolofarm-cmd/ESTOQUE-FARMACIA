<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estoque — Farmácia</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #ffffff;
      --border: #e4dfd7;
      --text: #1d1d1b;
      --muted: #6c695f;
      --green: #1d9e75;
      --green-bg: #eaf3de;
      --green-text: #3b6d11;
      --red: #d85a30;
      --red-bg: #fcebeb;
      --red-text: #a32d2d;
      --amber: #ba7517;
      --amber-bg: #faeeda;
      --amber-text: #854f0b;
      --blue: #185fa5;
      --blue-bg: #e6f1fb;
      --blue-text: #0c447c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .badge-out {
      background: var(--red-bg);
      color: var(--red-text);
    }
    .badge-out .badge-dot { background: var(--red-text); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f3f1ec;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    td {
      font-size: 14px;
    }

    .status {
      font-weight: 700;
    }

    .status.out {
      color: var(--red-text);
    }

    .small {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Estoque — Farmácia</h1>
      <div class="badge badge-out"><span class="badge-dot"></span>Em falta</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Medicamento</th>
          <th>Forma farmacêutica</th>
          <th>Concentração</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const medicamentos = [
      ["SULFATO FERROSO", "Comprimido", "40 mg", "out"],
      ["MICONAZOL (NITRATO DE)", "Creme vaginal", "(2%) 20 mg/g", "out"],
      ["DOXAZOSINA (MESILATO DE)", "Comprimido", "2 mg", "out"]
    ];

    const statusLabel = {
      ok: "Disponível",
      out: "Em falta",
      low: "Baixo estoque",
      restrict: "Restrito"
    };

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = medicamentos.map(([nome, forma, concentracao, status]) => `
      <tr>
        <td>${nome}</td>
        <td>${forma}</td>
        <td>${concentracao}</td>
        <td class="status out">${statusLabel[status]}</td>
      </tr>
    `).join('');
  </script>
</body>
</html>
